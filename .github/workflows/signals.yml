name: Pin Bar Signal Check

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

defaults:
  run:
    working-directory: .

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found at repo root — installing directly"
            pip install ccxt pandas pyyaml yfinance requests
          fi

      - name: Run signal check (one-shot)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ONCE: "1"
        run: python main.py

      - name: Commit updated state file
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f state/state.json ]; then
            git add state/state.json
          fi
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          git push
